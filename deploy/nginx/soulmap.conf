# =============================================================================
# SoulMap AI — Nginx 生产配置
# -----------------------------------------------------------------------------
# 拓扑（见 docs/PROJECT_ARCHITECTURE.md §17.1）：
#   Internet → Nginx(443) → /api/*  → backend:3000
#                         → /admin/* → 管理后台静态资源（SPA）
#                         → /health  → backend:3000（仅内网放行）
#
# 使用方式：
#   挂载到容器 /etc/nginx/conf.d/soulmap.conf
#   证书路径按实际修改；域名替换 api.example.com / admin.example.com
# =============================================================================

# ------------------------------------------------------------------ 限流区
# 全局限流是纵深防御的第一层（应用层还有基于用户的细粒度限流）
limit_req_zone $binary_remote_addr zone=api_general:10m rate=100r/m;
limit_req_zone $binary_remote_addr zone=api_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_ai:10m rate=20r/m;

# 上游：backend 容器（在同一 docker network 内按服务名解析）
upstream soulmap_backend {
    server backend:3000 max_fails=3 fail_timeout=15s;
    keepalive 32;
}

# HTTP → HTTPS 跳转
server {
    listen 80;
    listen [::]:80;
    server_name api.example.com admin.example.com;

    # ACME 校验放行（certbot webroot）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------ API 服务
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.example.com;

    # ---------------------------------------------------------------- 证书
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ------------------------------------------------------------ 安全响应头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Request-Id $request_id always;

    # 隐藏版本号
    server_tokens off;

    # ------------------------------------------------------------ 请求体限制
    # 头像与分享图走 OSS 直传，因此 Nginx 侧限制得较小
    client_max_body_size 2m;
    client_body_timeout 30s;

    # ---------------------------------------------------------------- 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types application/json application/javascript text/plain text/css application/xml;

    # ------------------------------------------------------------ 超时设置
    proxy_connect_timeout 5s;
    proxy_send_timeout    90s;
    proxy_read_timeout    90s;

    # 上游连接复用
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # 客户端真实信息透传（应用层限流与审计依赖）
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id      $request_id;

    # ------------------------------------------------------------ 健康检查
    # 仅允许内网访问探针，避免对外暴露依赖状态
    location = /health/live {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://soulmap_backend;
    }

    location = /health/ready {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;
        access_log off;
        proxy_pass http://soulmap_backend;
    }

    location = /health/version {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://soulmap_backend;
    }

    # ------------------------------------------------------------ 登录接口限流
    location ~ ^/api/v1/auth/(wechat/login|refresh)$ {
        limit_req zone=api_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://soulmap_backend;
    }

    # ------------------------------------------------------------ AI 接口限流
    location ~ ^/api/v1/(ai|reports|relationships/.*/compatibility) {
        limit_req zone=api_ai burst=10 nodelay;
        limit_req_status 429;

        # AI 报告生成为异步任务，但 SSE 流式对话是长连接，需要更长读超时
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
        # SSE 必须关闭缓冲，否则前端收不到逐字输出
        chunked_transfer_encoding on;

        proxy_pass http://soulmap_backend;
    }

    # ------------------------------------------------------------ 支付回调
    # 微信回调要求 5 秒内响应，不施加额外限流，避免重试放大
    location = /api/v1/payments/wechat/notify {
        proxy_pass http://soulmap_backend;
    }

    # ------------------------------------------------------------ 通用 API
    location /api/ {
        limit_req zone=api_general burst=50 nodelay;
        limit_req_status 429;
        proxy_pass http://soulmap_backend;
    }

    # 其余路径一律 404（本域只提供 API）
    location / {
        return 404;
    }
}

# ------------------------------------------------------------- 管理后台 SPA
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    # 管理后台的 CSP：只允许自身资源，禁止被嵌入第三方
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://api.example.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    root /usr/share/nginx/html/admin;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain;

    # 带 contenthash 的静态资源可长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # SPA 前端路由回退（必须放在最后）
    location / {
        try_files $uri $uri/ /index.html;
        # index.html 绝不缓存，保证发布后立即生效
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 后台的 API 请求同样走后端（避免跨域预检）
    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id      $request_id;
        proxy_pass http://soulmap_backend;
    }
}
